name: Build and Release NppRemoveLines

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        arch: [x64, x86]
        include:
          - arch: x64
            msystem: MINGW64
            pkg: mingw-w64-x86_64
          - arch: x86
            msystem: MINGW32
            pkg: mingw-w64-i686

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.pkg }}-gcc
            make

      - name: Build plugin
        run: |
          make clean
          make
          cp NppRemoveLines.dll NppRemoveLines-${{ matrix.arch }}.dll

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NppRemoveLines-${{ matrix.arch }}
          path: NppRemoveLines-${{ matrix.arch }}.dll

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NppRemoveLines-x64/NppRemoveLines-x64.dll
            NppRemoveLines-x86/NppRemoveLines-x86.dll
          generate_release_notes: true
